<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="200" height="200" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- FPT Tri-color Emblem -->
  <g transform="translate(38, 42)">
    <!-- Blue F -->
    <path d="M 18 0 L 38 0 L 26 58 L 6 58 Z" fill="#005CA9"/>
    <!-- Orange P -->
    <path d="M 44 0 L 64 0 L 52 58 L 32 58 Z" fill="#F37021"/>
    <!-- Green T -->
    <path d="M 70 0 L 90 0 L 78 58 L 58 58 Z" fill="#009A44"/>
    
    <!-- White Letters -->
    <text x="21" y="39" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#ffffff">F</text>
    <text x="47" y="39" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#ffffff">P</text>
    <text x="73" y="39" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#ffffff">T</text>
  </g>

  <!-- Software Text -->
  <text x="100" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="20" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">Software</text>
  <text x="100" y="162" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#005CA9" text-anchor="middle" letter-spacing="2">GLOBAL TECH</text>
</svg>
