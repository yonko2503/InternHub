<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hubBadgeGradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="25%" stop-color="#0072ff" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="hubCapGradient" x1="100" y1="10" x2="180" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="hubTieGradient" x1="100" y1="80" x2="100" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Graduation Cap Shadow & Layer -->
  <g transform="translate(5, -5)">
    <polygon points="140,18 182,36 140,54 98,36" fill="url(#hubCapGradient)" stroke="#ffffff" stroke-width="3" />
    <path d="M 112,42 Q 140,56 168,42 L 168,48 Q 140,64 112,48 Z" fill="#312e81" />
    <path d="M 175,34 C 182,40 185,50 184,62" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="184" cy="65" r="4.5" fill="#7c3aed" />
  </g>

  <!-- Rounded Squircle Container -->
  <rect x="24" y="38" width="144" height="144" rx="42" fill="url(#hubBadgeGradient)" />

  <!-- Briefcase Handle -->
  <path d="M 72,56 C 72,48 78,44 86,44 L 106,44 C 114,44 120,48 120,56 L 120,62 L 72,62 Z" fill="#ffffff" />
  <rect x="80" y="50" width="32" height="8" rx="3" fill="url(#hubBadgeGradient)" />

  <!-- Briefcase Body -->
  <rect x="42" y="60" width="108" height="78" rx="18" fill="#ffffff" />

  <!-- Briefcase Flap lines -->
  <path d="M 42,78 L 74,94 M 150,78 L 118,94" stroke="url(#hubTieGradient)" stroke-width="4" stroke-linecap="round" />

  <!-- Person Icon / Tie in center -->
  <circle cx="96" cy="84" r="7.5" fill="url(#hubTieGradient)" />
  <path d="M 91,99 C 91,96 93,95 96,95 C 99,95 101,96 101,99 L 101,118 C 101,122 91,122 91,118 Z" fill="url(#hubTieGradient)" />
</svg>